name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --check

  smoke:
    name: Compatibility smoke (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tests/smoke-no-run.ps1
